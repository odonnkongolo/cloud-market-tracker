# 1. The Deployment: Tells the EKS nodes how to run your Docker container

apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-tracker-app
spec:
  replicas: 2 # Runs two copies of your app simultaneously for High Availability
  selector:
    matchLabels:
      app: market-tracker
  template:
    metadata:
      labels:
        app: market-tracker
    spec:
      containers:
      - name: market-tracker
        # Points directly to the ECR registry we built earlier
        image: 084000526807.dkr.ecr.eu-west-1.amazonaws.com/market-tracker-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501

---
# 2. The Service: Commands AWS to build a Load Balancer so the public can reach the app

apiVersion: v1
kind: Service
metadata:
  name: market-tracker-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb" # Provisions a blazing-fast AWS Network Load Balancer
spec:
  selector:
    app: market-tracker
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer